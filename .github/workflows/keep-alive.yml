name: Supabase Keep-Alive

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Testando endpoint de Saude (Health)..."
          curl -i "${{ secrets.SUPABASE_URL }}/auth/v1/health"

          echo -e "\n\nTestando API REST com autenticacao..."
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
